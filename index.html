<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 class="title">Color Changer</h1>

    

    <div class="btn-row">
      <button class="button" id="red">Red</button>
      <button class="button" id="blue">Blue</button>
      <button class="button" id="green">Green</button>
      <button class="button" id="yellow">Yellow</button>
    </div>
    <div>
        <button class="button reset" id="reset">Reset</button>
    </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
